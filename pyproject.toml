[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "umgqrunner"
version = "1.0.1"
authors = [
    { name="Job Jeremías González", email="jgonzalezg58@miumg.edu.gt" },
    { name="Luis Carlos Lima", email="llimap5@miumg.edu.gt" },
    { name= "Alba Cristina Nájera", email= "anajeram@miumg.edu.gt" },
    { name="Julio Cesar Sandoval", email="jsandovalb2@miumg.edu.gt"},
]
description = "Motor de consultas tipo SQL sobre archivos CSV / JSON"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "antlr4-python3-runtime>=4.13.0",
    "pandas>=1.3.0",
    "prompt-toolkit>=3.0.0",
    "typer>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/luislima0907/QueryRunner.git"